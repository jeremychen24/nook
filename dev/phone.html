<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nook Phone Preview</title>
  <style>
    :root { --bg: #0f1012; --text: #e9e6e1; --muted: #8d9199; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(80% 60% at 50% 35%, #1b1c20, var(--bg));
      color: var(--text);
      font: 14px -apple-system, "Segoe UI", sans-serif;
    }
    body { display: flex; flex-direction: column; align-items: center; overflow: hidden; }

    .bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 16px 16px 0; }
    .bar.sky { padding-top: 8px; }
    .bar button {
      font: inherit;
      color: var(--muted);
      background: #1e2024;
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
    }
    .bar button.on { background: var(--text); color: var(--bg); }
    .bar .sep { width: 10px; }

    .stage { flex: 1; width: 100%; min-height: 0; display: grid; place-items: center; }

    .phone {
      position: relative;
      padding: 12px;
      background: #050506;
      border-radius: calc(var(--r) + 12px);
      box-shadow: 0 0 0 2px #2b2d33, 0 0 0 5px #121316, 0 30px 80px rgba(0, 0, 0, .6);
      transform: scale(var(--s, 1));
    }
    .screen {
      position: relative;
      width: var(--w);
      height: var(--h);
      border-radius: var(--r);
      overflow: hidden;
      background: #16171a;
    }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    .status {
      position: absolute;
      inset: 0 0 auto;
      height: var(--top);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      font: 600 15px -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      pointer-events: none;
    }
    .notch .status { align-items: start; }
    .notch .status > span { padding-top: 19px; }
    .status .time { justify-self: center; }
    .status .icons { justify-self: center; display: flex; gap: 5px; align-items: center; }
    .island { width: 0; }
    .notch .island { width: 125px; height: 37px; margin-top: 11px; border-radius: 20px; background: #000; }
    .home {
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 134px;
      height: 5px;
      margin-left: -67px;
      border-radius: 3px;
      background: #fff;
      opacity: .85;
      pointer-events: none;
    }
    .phone:not(.notch) .home { display: none; }
    .phone:not(.notch) .status { font-size: 12px; }
  </style>
</head>
<body>
  <div class="bar">
    <button data-device="se">SE</button>
    <button data-device="i15">15</button>
    <button data-device="max">Pro Max</button>
    <span class="sep"></span>
    <button id="reload">Reload</button>
  </div>
  <div class="bar sky">
    <button data-tod="auto">Auto</button>
    <button data-tod="dawn">Dawn</button>
    <button data-tod="day">Day</button>
    <button data-tod="sunset">Sunset</button>
    <button data-tod="dusk">Dusk</button>
    <button data-tod="night">Night</button>
    <span class="sep"></span>
    <button id="rain">Rain</button>
  </div>

  <div class="stage">
    <div class="phone">
      <div class="screen">
        <iframe title="Nook"></iframe>
        <div class="status">
          <span class="time" id="clock">9:41</span>
          <div class="island"></div>
          <span class="icons">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.7" y="5" width="3" height="6" rx="1"/><rect x="9.3" y="2.5" width="3" height="8.5" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
            <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 10.8 5.3 8.5a3.1 3.1 0 0 1 4.4 0zM3.3 6.5a6 6 0 0 1 8.4 0l-1.3 1.3a4.1 4.1 0 0 0-5.8 0zM1.1 4.3a9.1 9.1 0 0 1 12.8 0l-1.3 1.3a7.2 7.2 0 0 0-10.2 0z"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x=".5" y=".5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="2"/><path d="M23 4v4a2 2 0 0 0 0-4z" opacity=".45"/></svg>
          </span>
        </div>
        <div class="home"></div>
      </div>
    </div>
  </div>

  <script>
    // Screen sizes and safe areas in CSS pixels.
    const DEVICES = {
      se:  { w: 375, h: 667, r: 0,  top: 20, bottom: 0,  notch: false },
      i15: { w: 393, h: 852, r: 48, top: 59, bottom: 34, notch: true },
      max: { w: 430, h: 932, r: 54, top: 59, bottom: 34, notch: true },
    };

    const phone = document.querySelector('.phone');
    const stage = document.querySelector('.stage');
    const frame = document.querySelector('iframe');
    let current = 'i15';
    try { current = localStorage.getItem('nook-preview-device') || current; } catch {}
    if (!DEVICES[current]) current = 'i15';

    // The app reads --safe-top/--safe-bottom, so the frame can reserve room for the island and home bar.
    function applySafeArea() {
      const d = DEVICES[current];
      try {
        const root = frame.contentDocument.documentElement;
        root.style.setProperty('--safe-top', `${d.top}px`);
        root.style.setProperty('--safe-bottom', `${d.bottom}px`);
      } catch {}
    }

    function fit() {
      const d = DEVICES[current];
      const s = Math.min(1, (stage.clientHeight - 24) / (d.h + 24), (stage.clientWidth - 24) / (d.w + 24));
      phone.style.setProperty('--s', s);
    }

    function setDevice(key) {
      current = key;
      const d = DEVICES[key];
      for (const [prop, value] of Object.entries({ w: d.w, h: d.h, r: d.r, top: d.top })) {
        phone.style.setProperty(`--${prop}`, `${value}px`);
      }
      phone.classList.toggle('notch', d.notch);
      document.querySelectorAll('[data-device]').forEach(b => b.classList.toggle('on', b.dataset.device === key));
      try { localStorage.setItem('nook-preview-device', key); } catch {}
      applySafeArea();
      fit();
    }

    function tickClock() {
      const now = new Date();
      document.getElementById('clock').textContent = `${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    // Sky preview: the app reads ?tod= and ?rain= on load, so changing them reloads the frame.
    // Also settable from this page's URL, e.g. phone.html?tod=night&rain=1&device=se
    const params = new URLSearchParams(location.search);
    let tod = params.get('tod') || 'auto';
    let rain = params.get('rain') === '1';
    if (DEVICES[params.get('device')]) current = params.get('device');
    function applySky() {
      document.querySelectorAll('[data-tod]').forEach(b => b.classList.toggle('on', b.dataset.tod === tod));
      document.getElementById('rain').classList.toggle('on', rain);
      const query = new URLSearchParams();
      if (tod !== 'auto') query.set('tod', tod);
      if (rain) query.set('rain', '1');
      if (params.get('scene')) query.set('scene', params.get('scene'));
      frame.src = `../index.html${query.size ? `?${query}` : ''}`;
    }

    document.querySelector('.bar').addEventListener('click', e => {
      const btn = e.target.closest('[data-device]');
      if (btn) setDevice(btn.dataset.device);
    });
    document.querySelector('.bar.sky').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.id === 'rain') rain = !rain;
      else tod = btn.dataset.tod;
      applySky();
    });
    document.getElementById('reload').addEventListener('click', () => frame.contentWindow.location.reload());
    frame.addEventListener('load', applySafeArea);
    addEventListener('resize', fit);

    setDevice(current);
    applySky();
    tickClock();
    setInterval(tickClock, 15000);
  </script>
</body>
</html>
